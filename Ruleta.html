  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fdiv>\n<div style=\"display: flex; align-items: center; gap: 10px; background: #21123C; border: 2px solid #3A2462; border-radius: 999px; padding: 10px 18px\">\n<svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#FFC23D\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><circle cx=\"9\" cy=\"8\" r=\"4\"><\u002Fcircle><path d=\"M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7\"><\u002Fpath><path d=\"M16 4a4 4 0 0 1 0 8\"><\u002Fpath><path d=\"M19 14c1.8.9 3 2.8 3 5\"><\u002Fpath><\u002Fsvg>\n<span style=\"font-weight: 700; font-size: 16px\">{{count}} en el baile<\u002Fspan>\n<\u002Fdiv>\n<\u002Fheader>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start\">\n\n<div style=\"flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 30px\">\n\n<div class=\"{{wheelCls}}\" style=\"position: relative; width: 100%; max-width: 560px; aspect-ratio: 1 / 1\">\n<div style=\"position: absolute; inset: 0; border-radius: 50%; background: #2A1748; box-shadow: 0 0 0 6px #FFC23D, 0 24px 60px rgba(255, 61, 127, 0.25)\"><\u002Fdiv>\n<div style=\"position: absolute; inset: 0; transform: rotate({{rot}}deg); transition: transform {{dur}}s cubic-bezier(0.12, 0.8, 0.1, 1)\">\n<sc-if value=\"{{empty}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 9%; border-radius: 50%; background: #21123C; border: 3px dashed #4B3277\"><\u002Fdiv>\n<\u002Fsc-if>\n<sc-for list=\"{{segs}}\" as=\"seg\" hint-placeholder-count=\"4\">\n<svg sc-camel-view-box=\"0 0 500 500\" style=\"position: absolute; inset: 0; width: 100%; height: 100%\" aria-hidden=\"true\"><path d=\"{{seg.d}}\" fill=\"{{seg.bg}}\" stroke=\"#140A26\" stroke-width=\"3\" stroke-linejoin=\"round\"><\u002Fpath><text x=\"{{seg.tx}}\" y=\"252\" transform=\"{{seg.tf}}\" text-anchor=\"{{seg.anchor}}\" dominant-baseline=\"middle\" fill=\"{{seg.fg}}\" font-family=\"Bungee, sans-serif\" font-size=\"{{fs}}\">{{seg.label}}<\u002Ftext><\u002Fsvg>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-for list=\"{{bulbs}}\" as=\"b\" hint-placeholder-count=\"24\">\n<div class=\"{{b.cls}}\" style=\"position: absolute; left: {{b.x}}%; top: {{b.y}}%; width: 2.6%; height: 2.6%; border-radius: 50%; transform: translate(-50%, -50%); background: #FFF6D6\"><\u002Fdiv>\n<\u002Fsc-for>\n<svg sc-camel-view-box=\"0 0 500 500\" style=\"position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none\" aria-hidden=\"true\"><circle cx=\"250\" cy=\"250\" r=\"207\" fill=\"none\" stroke=\"#FFC23D\" stroke-width=\"4\"><\u002Fcircle><path d=\"M228 4 L272 4 L250 70 Z\" fill=\"#FF3D7F\" stroke=\"#FFF4E3\" stroke-width=\"5\" stroke-linejoin=\"round\"><\u002Fpath><circle cx=\"250\" cy=\"20\" r=\"6\" fill=\"#FFF4E3\"><\u002Fcircle><\u002Fsvg>\n<button class=\"hub\" sc-camel-on-click=\"{{spin}}\" disabled=\"{{noSpin}}\" aria-label=\"Girar la ruleta\" style=\"position: absolute; left: 50%; top: 50%; width: 26%; height: 26%; transform: translate(-50%, -50%); border-radius: 50%; border: 7px solid #140A26; background-color: #140A26; color: #FFFFFF; font-family: 'Bungee', sans-serif; font-size: 15px; box-shadow: 0 0 0 4px #FFC23D, 0 6px 0 4px #A86F0A; padding: 0; display: flex; align-items: flex-end; justify-content: center\"><span style=\"width: 100%; padding: 5px 0 9px; background: rgba(20, 10, 38, 0.78); letter-spacing: 0.06em\">GIRAR<\u002Fspan><\u002Fbutton>\n\n<sc-if value=\"{{hasWinner}}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: rgba(20, 10, 38, 0.78)\">\n<div class=\"pop\" role=\"dialog\" aria-label=\"Resultado\" style=\"width: 78%; box-sizing: border-box; background: #FFF4E3; color: #16082B; border: 4px solid #FFC23D; border-radius: 28px; box-shadow: 0 10px 0 #FF3D7F; padding: 28px 24px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center\">\n<span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.22em; color: #B3124F\">{{winnerHead}}<\u002Fspan>\n<div style=\"display: flex; align-items: center; gap: 12px; max-width: 100%\">\n<span style=\"flex: none; width: 18px; height: 18px; border-radius: 50%; background: {{winnerColor}}; border: 3px solid #16082B\"><\u002Fspan>\n<span style=\"font-family: 'Bungee', sans-serif; font-size: 40px; line-height: 1.05; overflow-wrap: anywhere\">{{winnerLabel}}<\u002Fspan>\n<\u002Fdiv>\n<span style=\"font-size: 15px; color: #4A3566\">{{winnerSub}}<\u002Fspan>\n<div style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 6px\">\n<button sc-camel-on-click=\"{{closeWinner}}\" style=\"min-height: 44px; padding: 0 22px; border-radius: 999px; border: none; background: #16082B; color: #FFF4E3; font-weight: 700; font-size: 15px\">Que siga la joda<\u002Fbutton>\n<button sc-camel-on-click=\"{{dropWinner}}\" style=\"min-height: 44px; padding: 0 22px; border-radius: 999px; border: 2px solid #16082B; background: transparent; color: #16082B; font-weight: 700; font-size: 15px\">Afuera, ya fue<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<button sc-camel-on-click=\"{{spin}}\" disabled=\"{{noSpin}}\" style=\"min-height: 64px; padding: 0 60px; border-radius: 999px; border: none; background: #FF3D7F; color: #FFFFFF; font-family: 'Bungee', sans-serif; font-size: 24px; letter-spacing: 0.04em; box-shadow: 0 7px 0 #A3134A\">{{spinText}}<\u002Fbutton>\n\n<div style=\"width: 100%; max-width: 560px; display: flex; flex-direction: column; gap: 12px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px\">\n<span style=\"font-size: 13px; font-weight: 700; letter-spacing: 0.18em; color: #C9B8E6\">LOS QUE YA LIGARON<\u002Fspan>\n<button class=\"ghost\" sc-camel-on-click=\"{{clearHistory}}\" style=\"min-height: 44px; padding: 0 8px; border: none; background: transparent; color: #C9B8E6; font-size: 14px; font-weight: 500\">Limpiar<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<sc-if value=\"{{noHistory}}\" hint-placeholder-val=\"{{ true }}\">\n<span style=\"font-size: 15px; color: #8F7DB0\">Acá todavía no ligó nadie. Dale, girá que se enfría el mate.<\u002Fspan>\n<\u002Fsc-if>\n<sc-for list=\"{{history}}\" as=\"h\" hint-placeholder-count=\"0\">\n<span style=\"display: inline-flex; align-items: center; gap: 8px; padding: 7px 14px 7px 10px; border-radius: 999px; background: #21123C; border: 2px solid {{h.ring}}; font-size: 15px; font-weight: 500\"><span style=\"width: 10px; height: 10px; border-radius: 50%; background: {{h.color}}\"><\u002Fspan>{{h.label}}<\u002Fspan>\n<\u002Fsc-for>\n<\u002Fdiv>\n<p style=\"margin: 4px 0 0; padding: 12px 16px; border-radius: 14px; background: rgba(255, 61, 127, 0.12); border: 2px dashed #FF3D7F; font-size: 14px; line-height: 1.45; color: #FFD3E2\"><strong style=\"color: rgb(255, 255, 255)\">Departamento de reclamos:<\u002Fstrong> la ruleta no acepta quejas, apelaciones ni “pero yo no estaba listo”. Si no te gustó el resultado, andá a llorarle a Lord Chiqui Tapia.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<aside style=\"flex: 1 1 340px; min-width: 0; max-width: 100%; box-sizing: border-box; background: rgba(33, 18, 60, 0.82); backdrop-filter: blur(14px); border: 2px solid #3A2462; border-radius: 28px; padding: 26px; display: flex; flex-direction: column; gap: 24px\">\n\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<label for=\"nuevo\" style=\"font-size: 14px; font-weight: 700; color: #FFF4E3\">Sumá una víctima<\u002Flabel>\n<div style=\"display: flex; gap: 10px\">\n<input id=\"nuevo\" type=\"text\" value=\"{{draft}}\" sc-camel-on-change=\"{{onDraft}}\" sc-camel-on-key-down=\"{{onDraftKey}}\" placeholder=\"Ej: el que nunca pone para el asado\" style=\"flex: 1 1 auto; min-width: 0; min-height: 48px; box-sizing: border-box; padding: 0 16px; border-radius: 14px; border: 2px solid #4B3277; background: #160B2B; color: #FFF4E3; font-family: inherit; font-size: 16px\">\n<button sc-camel-on-click=\"{{add}}\" style=\"flex: none; min-height: 48px; padding: 0 20px; border-radius: 14px; border: none; background: {{accent}}; color: #2A1145; font-weight: 700; font-size: 16px\">¡Adentro!<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<label for=\"masiva\" style=\"font-size: 14px; font-weight: 700; color: #FFF4E3\">Carga al por mayor <span style=\"font-weight: 400; color: #C9B8E6\">· uno por renglón o con comas, como venga<\u002Fspan><\u002Flabel>\n<textarea id=\"masiva\" rows=\"4\" value=\"{{bulk}}\" sc-camel-on-change=\"{{onBulk}}\" placeholder=\"El Tano\nLa Colo\nEl primo de Fede que cayó sin avisar\" style=\"box-sizing: border-box; width: 100%; padding: 12px 16px; border-radius: 14px; border: 2px solid #4B3277; background: #160B2B; color: #FFF4E3; font-family: inherit; font-size: 16px; line-height: 1.5; resize: vertical\"><\u002Ftextarea>\n<button sc-camel-on-click=\"{{addBulk}}\" style=\"min-height: 48px; border-radius: 14px; border: 2px solid #FFC23D; background: transparent; color: #FFC23D; font-weight: 700; font-size: 16px\">Mandalos a todos al ruedo<\u002Fbutton>\n<\u002Fdiv>\n\n<div style=\"height: 2px; background: #3A2462\"><\u002Fdiv>\n\n<div style=\"display: flex; flex-direction: column; gap: 10px\">\n<div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px\">\n<div style=\"display: flex; align-items: center; gap: 10px\">\n<span style=\"font-size: 16px; font-weight: 700\">Los anotados<\u002Fspan>\n<span style=\"min-width: 28px; height: 28px; padding: 0 8px; box-sizing: border-box; border-radius: 999px; background: #FF3D7F; color: #FFFFFF; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center\">{{count}}<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display: flex; gap: 4px\">\n<button class=\"ghost\" sc-camel-on-click=\"{{shuffle}}\" style=\"min-height: 44px; padding: 0 10px; border: none; background: transparent; color: #C9B8E6; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M16 3h5v5\"><\u002Fpath><path d=\"M4 20 21 3\"><\u002Fpath><path d=\"M21 16v5h-5\"><\u002Fpath><path d=\"M15 15l6 6\"><\u002Fpath><path d=\"M4 4l5 5\"><\u002Fpath><\u002Fsvg>Mezclar<\u002Fbutton>\n<button class=\"ghost\" sc-camel-on-click=\"{{clearAll}}\" style=\"min-height: 44px; padding: 0 10px; border: none; background: transparent; color: #C9B8E6; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px\"><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M3 6h18\"><\u002Fpath><path d=\"M8 6V4h8v2\"><\u002Fpath><path d=\"M19 6l-1 14H6L5 6\"><\u002Fpath><\u002Fsvg>Barajar y dar de nuevo<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; gap: 4px; max-height: 300px; overflow-y: auto\">\n<sc-if value=\"{{empty}}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"padding: 14px 4px; font-size: 15px; color: #8F7DB0\">Más vacía que la heladera a fin de mes. Sumá a alguien arriba.<\u002Fspan>\n<\u002Fsc-if>\n<sc-for list=\"{{rows}}\" as=\"r\" hint-placeholder-count=\"4\">\n<div class=\"row\" style=\"display: flex; align-items: center; gap: 12px; padding: 4px 4px 4px 12px; border-radius: 12px\">\n<span style=\"width: 22px; font-size: 13px; font-weight: 700; color: #8F7DB0\">{{r.num}}<\u002Fspan>\n<span style=\"flex: none; width: 14px; height: 14px; border-radius: 50%; background: {{r.color}}\"><\u002Fspan>\n<span style=\"flex: 1 1 auto; min-width: 0; font-size: 16px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap\">{{r.label}}<\u002Fspan>\n<button class=\"ghost\" sc-camel-on-click=\"{{r.remove}}\" aria-label=\"Quitar {{r.label}}\" style=\"flex: none; width: 44px; height: 44px; border: none; border-radius: 10px; background: transparent; color: #C9B8E6; display: inline-flex; align-items: center; justify-content: center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12\"><\u002Fpath><path d=\"M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<label style=\"display: flex; align-items: flex-start; gap: 12px; padding: 14px 16px; border-radius: 16px; background: #160B2B; border: 2px solid #3A2462; cursor: pointer\">\n<input type=\"checkbox\" checked=\"{{removeWinner}}\" sc-camel-on-change=\"{{toggleRemove}}\" style=\"flex: none; width: 20px; height: 20px; margin: 1px 0 0; accent-color: #FF3D7F\">\n<span style=\"font-size: 15px; line-height: 1.4; color: #FFF4E3\"><strong>Modo eliminación:<\u002Fstrong> el que sale, se va a las duchas y no vuelve a jugar<\u002Fspan>\n<\u002Flabel>\n\n<\u002Faside>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFC23D&quot;,&quot;options&quot;:[&quot;#FFC23D&quot;,&quot;#1FC8B4&quot;,&quot;#3DA8FF&quot;,&quot;#FF7A2F&quot;]},&quot;spinSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;default&quot;:5,&quot;min&quot;:2,&quot;max&quot;:10,&quot;step&quot;:0.5,&quot;unit&quot;:&quot;s&quot;},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.nid = 5;\n    this.state = {\n      entries: [\n        { id: 1, label: 'Pipo' },\n        { id: 2, label: 'Tunel' },\n        { id: 3, label: 'Quique' },\n        { id: 4, label: 'Broster' }\n      ],\n      draft: '',\n      bulk: '',\n      rot: 0,\n      spinning: false,\n      winner: null,\n      history: [],\n      removeWinner: false\n    };\n  }\n\n  componentWillUnmount() {\n    if (this.t) clearTimeout(this.t);\n  }\n\n  palette() {\n    return [\n      { bg: '#FF3D7F', fg: '#FFFFFF' },\n      { bg: '#FFC23D', fg: '#2A1145' },\n      { bg: '#7B5CFF', fg: '#FFFFFF' },\n      { bg: '#1FC8B4', fg: '#16082B' },\n      { bg: '#FF7A2F', fg: '#2A1145' },\n      { bg: '#3DA8FF', fg: '#16082B' }\n    ];\n  }\n\n  colorFor(i, n) {\n    const P = this.palette();\n    let k = i % P.length;\n    if (n > 1 && i === n - 1 && k === 0) k = 3;\n    return P[k];\n  }\n\n  addLabels(labels) {\n    const clean = labels.map((s) => s.trim()).filter(Boolean);\n    if (!clean.length) return;\n    this.setState((s) => ({\n      entries: s.entries.concat(clean.map((label) => ({ id: this.nid++, label: label })))\n    }));\n  }\n\n  renderVals() {\n    const s = this.state;\n    const accent = this.props.accent ?? '#FFC23D';\n    const dur = this.props.spinSeconds ?? 5;\n    const n = s.entries.length;\n    const cx = 250, cy = 250, R = 205;\n    const a = n ? 360 / n : 360;\n    const pt = (deg, r) => {\n      const t = (deg - 90) * Math.PI / 180;\n      return (cx + r * Math.cos(t)).toFixed(2) + ' ' + (cy + r * Math.sin(t)).toFixed(2);\n    };\n    const short = (t) => (t.length > 14 ? t.slice(0, 13) + '…' : t);\n\n    const segs = s.entries.map((e, i) => {\n      const c = this.colorFor(i, n);\n      let d;\n      if (n === 1) {\n        d = 'M250 ' + (cy - R) + ' A' + R + ' ' + R + ' 0 1 1 250 ' + (cy + R) + ' A' + R + ' ' + R + ' 0 1 1 250 ' + (cy - R) + ' Z';\n      } else {\n        d = 'M250 250 L' + pt(i * a, R) + ' A' + R + ' ' + R + ' 0 ' + (a > 180 ? 1 : 0) + ' 1 ' + pt((i + 1) * a, R) + ' Z';\n      }\n      const theta = n === 1 ? 0 : (i + 0.5) * a - 90;\n      const norm = ((theta % 360) + 360) % 360;\n      const flip = norm > 90 && norm < 270;\n      return {\n        d: d,\n        bg: c.bg,\n        fg: c.fg,\n        label: short(e.label),\n        tf: 'rotate(' + (flip ? theta + 180 : theta).toFixed(2) + ' 250 250)',\n        tx: flip ? cx - R + 22 : cx + R - 22,\n        anchor: flip ? 'start' : 'end'\n      };\n    });\n\n    const bulbs = [];\n    for (let k = 0; k < 24; k++) {\n      const ang = (k + 0.5) * 15 * Math.PI / 180;\n      bulbs.push({\n        x: (50 + 44.4 * Math.sin(ang)).toFixed(2),\n        y: (50 - 44.4 * Math.cos(ang)).toFixed(2),\n        cls: k % 2 ? 'bulb b' : 'bulb'\n      });\n    }\n\n    const fs = n <= 4 ? 26 : n <= 8 ? 22 : n <= 14 ? 17 : n <= 22 ? 13 : 10;\n\n    const rows = s.entries.map((e, i) => ({\n      num: i + 1,\n      label: e.label,\n      color: this.colorFor(i, n).bg,\n      remove: () => this.setState((st) => ({ entries: st.entries.filter((x) => x.id !== e.id) }))\n    }));\n\n    const w = s.winner;\n\n    return {\n      accent: accent,\n      dur: dur,\n      count: n,\n      empty: n === 0,\n      segs: segs,\n      bulbs: bulbs,\n      fs: fs,\n      rot: s.rot,\n      wheelCls: s.spinning ? 'spinning' : 'idle',\n      noSpin: s.spinning || n < 2,\n      spinText: s.spinning ? s.spinMsg : n < 2 ? 'FALTA GENTE, CHE' : '¡DALE QUE VA!',\n      winnerHead: w ? w.head : '',\n      winnerSub: w ? w.sub : '',\n      hasWinner: !!w,\n      winnerLabel: w ? w.label : '',\n      winnerColor: w ? w.color : '#FFC23D',\n      history: s.history,\n      noHistory: s.history.length === 0,\n      rows: rows,\n      draft: s.draft,\n      bulk: s.bulk,\n      removeWinner: s.removeWinner,\n\n      onDraft: (ev) => this.setState({ draft: ev.target.value }),\n      onDraftKey: (ev) => {\n        if (ev.key === 'Enter') {\n          this.addLabels([this.state.draft]);\n          this.setState({ draft: '' });\n        }\n      },\n      add: () => {\n        this.addLabels([this.state.draft]);\n        this.setState({ draft: '' });\n      },\n      onBulk: (ev) => this.setState({ bulk: ev.target.value }),\n      addBulk: () => {\n        this.addLabels(this.state.bulk.split(/[\\n,]+/));\n        this.setState({ bulk: '' });\n      },\n      shuffle: () => {\n        if (this.state.spinning) return;\n        const arr = this.state.entries.slice();\n        for (let i = arr.length - 1; i > 0; i--) {\n          const j = Math.floor(Math.random() * (i + 1));\n          const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;\n        }\n        this.setState({ entries: arr });\n      },\n      clearAll: () => {\n        if (this.state.spinning) return;\n        this.setState({ entries: [], winner: null });\n      },\n      clearHistory: () => this.setState({ history: [] }),\n      toggleRemove: () => this.setState((st) => ({ removeWinner: !st.removeWinner })),\n\n      spin: () => {\n        const st = this.state;\n        const cnt = st.entries.length;\n        if (st.spinning || cnt < 2) return;\n        const seg = 360 / cnt;\n        const i = Math.floor(Math.random() * cnt);\n        const target = (i + 0.5) * seg + (Math.random() - 0.5) * seg * 0.7;\n        const cur = ((st.rot % 360) + 360) % 360;\n        const delta = ((360 - target - cur) % 360 + 720) % 360;\n        const next = st.rot + 360 * 7 + delta;\n        const picked = st.entries[i];\n        const color = this.colorFor(i, cnt).bg;\n        const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];\n        const spinMsg = pick(['ARRANCÓ EL BAILE…', 'NI PESTAÑEES…', 'AGARRATE CATALINA…', 'MÁS VUELTAS QUE UN TRÁMITE…', 'SE PICÓ, CHE…']);\n        const head = pick(['¡Y SALIÓ…!', '¡TE TOCÓ, PAPÁ!', '¡LA RULETA HABLÓ!', '¡FUISTE, CAMPEÓN!', '¡SE PUDRIÓ TODO!']);\n        const sub = pick(['¿No te gusta? Andá a llorarle al Chiqui Tapia.', 'Reclamos, a la AFA. Acá no se atiende.', 'Bancatela como un campeón.', 'Ni en pedo se repite.', 'Te tocó lavar los platos del asado.', 'Posta, la ruleta no miente.']);\n        this.setState({ rot: next, spinning: true, winner: null, spinMsg: spinMsg });\n        if (this.t) clearTimeout(this.t);\n        this.t = setTimeout(() => {\n          this.setState((s2) => ({\n            spinning: false,\n            winner: { id: picked.id, label: picked.label, color: color, head: head, sub: sub },\n            history: [{ label: picked.label, color: color, ring: '#3A2462' }]\n              .concat(s2.history)\n              .slice(0, 10)\n          }));\n        }, dur * 1000 + 150);\n      },\n      closeWinner: () => {\n        const st = this.state;\n        if (st.removeWinner && st.winner) {\n          const id = st.winner.id;\n          this.setState({ winner: null, entries: st.entries.filter((x) => x.id !== id) });\n        } else {\n          this.setState({ winner: null });\n        }\n      },\n      dropWinner: () => {\n        const st = this.state;\n        if (!st.winner) return;\n        const id = st.winner.id;\n        this.setState({ winner: null, entries: st.entries.filter((x) => x.id !== id) });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
